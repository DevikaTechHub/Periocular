{% extends 'temp/madmin.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>maguser</title>
</head>
<body>
	<center>
    <section>
        <h1>USER</h1>
		<table border="1" class="table table-striped">
			<tr>
				<td>Name</td>
				<td>Email</td>
				<td>Phone_no</td>
				<td>Place</td>
				<td>Pincode</td>
                <td>Status</td>
			</tr>
            {%  for i in x %}
			<tr>
				<td>{{ i.name }}</td>
				<td>{{ i.email }}</td>
				<td>{{ i.phone_no }}</td>
				<td>{{ i.place }}</td>
				<td>{{ i.pin_code }}</td>
                <td>{{ i.status }}</td>
				<td><a href="/user/approve/{{ i.user_id }}">Approve</a></td>
				<td><a href="/user/reject/{{ i.user_id }}">Reject</a></td>

			</tr>
            {% endfor %}
		</table>
    </section>
	</center>

</body>
</html>
{% endblock %}
