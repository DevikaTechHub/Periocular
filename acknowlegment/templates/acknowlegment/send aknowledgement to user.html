{% extends 'temp/morg.html' %}
{% block base %}
<!DOCTYPE html>
<html>
<head>
	<title>acknowledgement</title>
</head>
<body>
	<center>
        <section>
		<h2> ACKNOWLEDGEMENT </h2>
		<form method="post">
            {% csrf_token %}
			<table>
                <tr>
                    <td>User</td>
                    <td><select name="us" class="form-control">
                        <option>-----SELECT-----</option>
                        {% for i in a %}
                            <option value="{{ i.user_id }}">{{ i.name }}</option>
                        {% endfor %}
                    </select></td>
                </tr>
				<tr>
					<td>Acknowledgement</td>
					<td><input type="text" name="ac" placeholder="enter acknowledgement" class="form-control"></td>
				</tr>
				<tr>
					<td></td>
					<td><input type="submit" value="OK" class="btn btn-primary" style="width: 100px"></td>
				</tr>
			</table>
        </form>
        </section>
	</center>

</body>
</html>
{% endblock %}
